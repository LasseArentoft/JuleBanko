<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataLøn Julebanko</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>

  <main>
    <h1>DataLøn Julebanko</h1>

    <section class="stage" aria-label="Seneste nummer">
      <div class="hanger" id="hanger">
        <div class="string"></div>
        <div class="cap"></div>
        <div class="bauble" id="bauble">
          <span id="number" aria-live="polite">?</span>
        </div>
        <div class="burst" id="burst"></div>
      </div>
      <p class="status" id="status">Tryk for at trække det første nummer</p>

      <div class="actions">
        <button id="drawBtn" class="draw">Træk nummer</button>
        <button id="bankoBtn" class="banko">BANKO!</button>
      </div>
      <p class="prize">Der spilles om: <strong id="prize">1 række</strong></p>

      <div class="tools">
        <button id="undoBtn" class="ghost">Fortryd</button>
        <label class="toggle"><input type="checkbox" id="speakToggle"> Læs højt</label>
        <button id="resetBtn" class="ghost">Start forfra</button>
      </div>

      <div class="recent">
        <h2>Seneste fem</h2>
        <ol id="recent"></ol>
      </div>
    </section>

    <section class="board-wrap" aria-label="Trukne numre">
      <h2>Trukket: <span id="count">0</span> af 90</h2>
      <div class="board" id="board"></div>
    </section>
  </main>

  <dialog id="checkDialog" aria-labelledby="checkTitle">
    <form method="dialog" class="check">
      <h2 id="checkTitle">Banko! Lad os kontrollere</h2>
      <p class="hint" id="checkHint">Skriv tallene fra rækken eller pladen, adskilt af mellemrum eller komma.</p>
      <textarea id="checkInput" rows="3" placeholder="fx 4 17 23 58 81" inputmode="numeric" aria-describedby="checkHint"></textarea>
      <ul id="checkChips" class="chips"></ul>
      <p id="checkResult" class="result" aria-live="polite"></p>
      <div class="check-actions">
        <button class="ghost" value="cancel">Luk</button>
        <button type="button" id="approveBtn" class="draw small" hidden>Godkend banko</button>
      </div>
    </form>
  </dialog>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="script.js"></script>
</body>
</html>
