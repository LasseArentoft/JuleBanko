<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataLøn Julebanko</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>

  <main>
    <h1>DataLøn Julebanko</h1>

    <section class="stage" aria-label="Seneste nummer">
      <div class="hanger" id="hanger">
        <div class="string"></div>
        <div class="cap"></div>
        <div class="bauble" id="bauble">
          <span id="number" aria-live="polite">?</span>
        </div>
        <div class="shout" aria-hidden="true">Ryst posen!</div>
        <svg class="sack" viewBox="0 0 240 270" aria-hidden="true" focusable="false">
          <ellipse class="sack-shadow" cx="120" cy="262" rx="82" ry="8"/>
          <g class="peek">
            <circle class="b1" cx="96" cy="72" r="15"/>
            <circle class="b2" cx="123" cy="58" r="16"/>
            <circle class="b3" cx="150" cy="73" r="14"/>
          </g>
          <path class="sack-frill" d="M66 112 C52 84 84 66 94 92 C102 62 138 62 146 92 C156 68 188 84 174 112 Z"/>
          <path class="sack-body" d="M68 112 C26 154 14 214 50 244 C84 266 156 266 190 244 C226 214 214 154 172 112 Z"/>
          <path class="sack-shine" d="M60 168 C56 196 66 222 86 238 C70 214 66 192 76 160 Z"/>
          <rect class="sack-tie" x="58" y="102" width="124" height="22" rx="11"/>
          <text class="sack-text" x="120" y="196" text-anchor="middle" transform="rotate(-5 120 190)">BANKO</text>
        </svg>
        <div class="burst" id="burst"></div>
      </div>
      <p class="status" id="status">Ryst posen for at trække det første nummer</p>

      <div class="actions">
        <button id="drawBtn" class="draw">Ryst posen!</button>
        <button id="bankoBtn" class="banko">BANKO!</button>
      </div>
      <fieldset class="prize">
        <legend>Der spilles om</legend>
        <label><input type="radio" name="prize" value="1 række" checked><span>1 række</span></label>
        <label><input type="radio" name="prize" value="Fuld plade"><span>Fuld plade</span></label>
      </fieldset>

      <div class="tools">
        <button id="undoBtn" class="ghost">Fortryd</button>
        <label class="toggle"><input type="checkbox" id="speakToggle"> Læs højt</label>
        <label class="toggle"><input type="checkbox" id="soundToggle" checked> Festlyd</label>
        <button id="resetBtn" class="ghost">Start forfra</button>
      </div>

      <div class="recent">
        <h2>Seneste fem</h2>
        <ol id="recent"></ol>
      </div>
    </section>

    <section class="board-wrap" aria-label="Trukne numre">
      <h2>Trukket: <span id="count">0</span> af 90</h2>
      <div class="board" id="board"></div>
    </section>
  </main>

  <dialog id="checkDialog" aria-labelledby="checkTitle">
    <form method="dialog" class="check">
      <h2 id="checkTitle">Banko! Lad os kontrollere</h2>
      <p class="hint" id="checkHint">Skriv så mange tal du vil, adskilt af mellemrum eller komma.</p>
      <textarea id="checkInput" rows="3" placeholder="fx 4 17 23 58 81" inputmode="numeric" aria-describedby="checkHint"></textarea>
      <ul id="checkChips" class="chips"></ul>
      <p id="checkResult" class="result" aria-live="polite"></p>
      <div class="check-actions">
        <button class="ghost" value="cancel">Luk</button>
        <button type="button" id="approveBtn" class="draw small" hidden>Fejr banko!</button>
      </div>
    </form>
  </dialog>

  <div id="celebration" class="celebration" role="alert" tabindex="0" hidden>
    <div class="rays" aria-hidden="true"></div>
    <div class="celeb-inner">
      <div class="celeb-word" role="img" aria-label="Banko!">
        <span style="--i:0">B</span><span style="--i:1">A</span><span style="--i:2">N</span><span style="--i:3">K</span><span style="--i:4">O</span><span style="--i:5">!</span>
      </div>
      <p class="celeb-prize" id="celebPrize"></p>
      <p class="celeb-hint">Tryk for at lukke</p>
    </div>
  </div>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="script.js"></script>
</body>
</html>
